name: Sync Excel data

on:
  push:
    branches: ["main"]
    paths:
      - "data/source.xlsx"
      - "scripts/sync_excel.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install openpyxl

      - name: Parse Excel into dashboard JSON
        run: python scripts/sync_excel.py --excel data/source.xlsx --out data/dashboard-data.json

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard-data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Sync dashboard data from Excel"
            git push
          fi
