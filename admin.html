<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>骏延集团新媒体数据管理后台</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">Junyan Data Operations</p>
          <h1>新媒体数据管理后台</h1>
          <p>维护门店、月份和指标数据，发布后前台大屏自动刷新。</p>
        </div>
        <nav>
          <a href="./index.html">返回大屏</a>
          <button id="exportBtn" type="button">导出 JSON</button>
          <button id="publishBtn" class="primary" type="button">发布到 GitHub</button>
        </nav>
      </header>

      <section class="system-grid">
        <article class="card access-card">
          <h2>协作授权</h2>
          <label>
            <span>管理口令</span>
            <input id="accessCode" type="password" placeholder="输入内部口令" />
          </label>
          <label>
            <span>GitHub 写入 Token</span>
            <input id="githubToken" type="password" placeholder="fine-grained token，仅本次浏览器使用" />
          </label>
          <button id="unlockBtn" type="button">进入编辑</button>
          <p class="hint">口令只用于界面入口；真正发布数据需要 GitHub token。不要把 token 固定写进网页源码。</p>
        </article>

        <article class="card status-card">
          <h2>数据状态</h2>
          <dl>
            <div><dt>当前月份</dt><dd id="statusMonth">-</dd></div>
            <div><dt>门店数量</dt><dd id="statusStores">-</dd></div>
            <div><dt>最近同步</dt><dd id="statusSync">-</dd></div>
            <div><dt>发布目标</dt><dd>cdq3000/junyan-newmedia-dashboard</dd></div>
          </dl>
        </article>

        <article class="card upload-card">
          <h2>导入 / 覆盖</h2>
          <label class="file-drop">
            <input id="jsonFile" type="file" accept="application/json,.json" />
            <strong>导入 JSON</strong>
            <span>适合由 Excel 同步脚本生成后上传覆盖</span>
          </label>
          <button id="resetRemoteBtn" type="button">重新读取线上数据</button>
        </article>
      </section>

      <section id="editorArea" class="editor-area locked">
        <aside class="card sidebar" id="stores">
          <div class="card-head">
            <h2>门店维护</h2>
            <button id="addStoreBtn" type="button">新增</button>
          </div>
          <input id="storeSearch" class="search" placeholder="搜索门店" />
          <div id="storeList" class="store-list"></div>
        </aside>

        <section class="card editor-card">
          <div class="editor-toolbar">
            <div>
              <p class="eyebrow">Monthly Metrics</p>
              <h2>月度指标录入</h2>
            </div>
            <div class="field-row">
              <label>
                <span>月份</span>
                <select id="monthSelect"></select>
              </label>
              <button id="addMonthBtn" type="button">新增月份</button>
              <button id="renameStoreBtn" type="button">重命名门店</button>
              <button id="deleteStoreBtn" class="danger" type="button">删除门店</button>
            </div>
          </div>

          <div class="metric-grid">
            <label><span>直播场次</span><input data-metric="liveSessions" type="number" step="1" /></label>
            <label><span>短视频发布</span><input data-metric="shortVideos" type="number" step="1" /></label>
            <label><span>总线索量</span><input data-metric="leads" type="number" step="1" /></label>
            <label><span>邀约到店</span><input data-metric="visits" type="number" step="1" /></label>
            <label><span>新媒体订单</span><input data-metric="orders" type="number" step="1" /></label>
            <label><span>订单占零售占比</span><input data-metric="orderShare" type="number" step="0.001" placeholder="例如 0.176" /></label>
          </div>

          <div class="action-row">
            <button id="saveStoreBtn" class="primary" type="button">保存当前门店</button>
            <button id="saveLocalBtn" type="button">保存到浏览器草稿</button>
          </div>

          <div class="table-zone">
            <div class="card-head">
              <h2>本月全店数据</h2>
              <span id="dirtyBadge" class="dirty-badge">未修改</span>
            </div>
            <table>
              <thead>
                <tr>
                  <th>门店</th>
                  <th>直播</th>
                  <th>短视频</th>
                  <th>线索</th>
                  <th>到店</th>
                  <th>订单</th>
                  <th>占比</th>
                </tr>
              </thead>
              <tbody id="monthRows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="./admin.js"></script>
  </body>
</html>
